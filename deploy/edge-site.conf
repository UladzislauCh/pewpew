# Блок сайта pewpew для пограничного прокси (/root/edge).
#
# Файл ЛЕЖИТ ЗДЕСЬ, а не в edge, намеренно: правила отдачи — кэш, сжатие,
# фоллбэк — принадлежат приложению и должны меняться вместе с ним, одним
# коммитом. Edge его только монтирует:
#
#   ../pewpew/deploy/edge-site.conf:/etc/nginx/conf.d/20-pewpew.conf:ro
#   ../pewpew/dist:/var/www/pewpew:ro
#
# Своего nginx у pewpew нет: сайт — статика, и второй сервер перед файлами
# не окупался бы.
#
# Сертификат ОДИН на два имени: pewpew.baby и www.pewpew.baby.
#
# ПОРЯДОК ВКЛЮЧЕНИЯ ВАЖЕН: сперва выпустить сертификат, и только потом
# монтировать этот файл в edge. Nginx не стартует со ссылкой на несуществующий
# сертификат и утащит за собой соседние сайты. Шаги — в edge/ADD-pewpew.md.

# Оба имени по http уводим на https основного домена.
server {
    listen 80;
    listen [::]:80;
    server_name pewpew.baby www.pewpew.baby;

    # ACME-проверка ДО редиректа, и это НЕ ИЗБЫТОЧНОСТЬ.
    #
    # Общий обработчик в 00-common.conf ловит только домены, не совпавшие ни с
    # одним server_name. Как только у домена появился свой блок, проверка Let's
    # Encrypt попадает СЮДА и уходит в редирект на https, где корень уже другой
    # и файла нет. Продление молча ломается — заметно станет через два месяца,
    # когда сертификат протухнет. Проверять: `certbot renew --dry-run`.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pewpew.baby$request_uri;
    }
}

# www по https: отдельный блок, потому что редирект должен произойти ПОСЛЕ
# рукопожатия — браузер сначала проверит сертификат и только потом увидит ответ.
# Поэтому сертификат обязан покрывать оба имени, иначе на www будет не редирект,
# а предупреждение о чужом сертификате.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pewpew.baby;

    ssl_certificate     /etc/letsencrypt/live/pewpew.baby/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pewpew.baby/privkey.pem;

    return 301 https://pewpew.baby$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pewpew.baby;

    ssl_certificate     /etc/letsencrypt/live/pewpew.baby/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pewpew.baby/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/pewpew;
    index index.html;

    # Отдаёт .gz, заранее подготовленный scripts/compressDist.ts, вместо сжатия
    # на лету. Brotli-файлы рядом останутся лежать без дела: ngx_brotli в штатном
    # образе нет — проверено `nginx -V`.
    gzip_static on;

    # Имена ассетов содержат хеш содержимого — их можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Модели, звуки и снимки страниц: имена без хеша, поэтому срок скромнее.
    location ~ ^/(models|sounds|outro|icons|ru|en)/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Оболочку кэшировать НЕЛЬЗЯ: иначе выкладка не доедет до тех, кто уже заходил.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ГЛАВНАЯ СТРОКА. Приложение живёт по адресам без решётки (BrowserRouter),
    # и без фоллбэка прямой заход или F5 на /faq упрётся в 404 самого nginx —
    # react-router до браузера просто не доедет.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
