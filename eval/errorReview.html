<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion model error review</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #14161a; color: #d8dde5; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { position: sticky; top: 0; z-index: 5; background: #181b21; border-bottom: 1px solid #262b34; padding: 10px 16px; }
      h1 { font-size: 14px; font-weight: 600; margin: 0 0 6px; color: #9aa4b2; }
      #summary { color: #7f8b9a; }
      .controls { margin-top: 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      button { font: inherit; background: #232833; color: #d8dde5; border: 1px solid #333a47; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      button:hover { background: #2b3140; }
      label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
      .legend { color: #7f8b9a; display: flex; gap: 14px; }
      .swatch { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; }
      .swatch.band { background: rgba(90, 170, 255, 0.85); }
      .swatch.mask { background: rgba(255, 170, 60, 0.95); }

      main { display: grid; grid-template-columns: 280px 1fr; gap: 0; align-items: start; }
      #clips { border-right: 1px solid #262b34; height: calc(100vh - 92px); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
      .clip { text-align: left; display: block; width: 100%; border: 1px solid transparent; background: none; padding: 6px 8px; }
      .clip:hover { background: #1e222a; }
      .clip.active { background: #232833; border-color: #3a4252; }
      .clip .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .clip .meta { display: block; color: #6d7887; font-size: 11px; }
      .clip.sparse .name::before { content: '◆ '; color: #d98a3a; }
      .clip .done { float: right; color: #6f9f6f; font-size: 11px; padding-left: 6px; }
      .clip.complete .name { color: #8fbf8f; }

      #panel { padding: 12px 16px 60px; min-width: 0; }
      #status { color: #7f8b9a; margin-bottom: 12px; }

      .case { border: 1px solid #262b34; border-radius: 6px; padding: 10px; margin-bottom: 14px; background: #171a20; }
      .case.noted { border-color: #3d5a3d; }
      .head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
      .badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.04em; }
      .badge.fp { background: #4a2230; color: #ffb3c1; }
      .badge.fn { background: #22364a; color: #a9d4ff; }
      .truth b { color: #e8edf5; }
      .num { color: #7f8b9a; }
      .near { color: #c9a227; }
      .num b { color: #d8dde5; }
      .listen { padding: 1px 8px; font-size: 12px; }

      .strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
      .cell { margin: 0; flex: 0 0 auto; }
      .cell canvas { display: block; width: 168px; height: auto; border: 1px solid #2b3038; border-radius: 3px; cursor: zoom-in; }
      .cell.centre canvas { border-color: #6f8fbf; box-shadow: 0 0 0 1px #6f8fbf; }
      .cell figcaption { text-align: center; color: #6d7887; font-size: 11px; padding-top: 2px; }
      .cell.centre figcaption { color: #a9c4ea; }

      textarea { width: 100%; box-sizing: border-box; margin-top: 8px; min-height: 46px; resize: vertical;
        background: #12151a; color: #d8dde5; border: 1px solid #2b3038; border-radius: 4px; padding: 6px 8px; font: inherit; }
      textarea:focus { outline: none; border-color: #4a5568; }

      #lightbox { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 13, 0.94);
        align-items: center; justify-content: center; flex-direction: column; gap: 10px; cursor: zoom-out; }
      #lightboxImage { max-width: 96vw; max-height: 88vh; width: auto; height: auto; border: 1px solid #333a47; }
      #lightboxLabel { color: #9aa4b2; }
    </style>
  </head>
  <body>
    <header>
      <h1>Motion model error review — what is in the frame where it missed</h1>
      <div id="summary">loading…</div>
      <div class="controls">
        <label><input type="checkbox" id="overlay" checked /> model boxes</label>
        <span class="legend">
          <span><i class="swatch band"></i>gameplay band</span>
          <span><i class="swatch mask"></i>“weapon” mask</span>
        </span>
        <button id="download">download notes</button>
      </div>
    </header>
    <main>
      <div id="clips"></div>
      <div id="panel">
        <div id="status"></div>
        <div id="cases"></div>
      </div>
    </main>
    <div id="lightbox"><canvas id="lightboxImage"></canvas><div id="lightboxLabel"></div></div>
    <script type="module" src="./errorReview.ts"></script>
  </body>
</html>
